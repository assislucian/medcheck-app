services:
  # Frontend MedCheck - React/Vite Otimizado
  - type: web
    name: medcheck-frontend
    env: node
    plan: starter
    buildCommand: |
      # Instalar dependências
      npm ci
      
      # Build otimizado para produção
      npm run build
      
      # Verificar se o build foi criado
      echo "✅ Build completed successfully"
      ls -la dist/
      
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: VITE_ENABLE_CACHE
        value: "true"
      - key: VITE_PERFORMANCE_MODE
        value: "optimized"
    
    # Garantir que usa Node.js
    buildFilter:
      paths:
      - "**"
      ignoredPaths:
      - "../**/*.py"
      - "../requirements.txt"
      - "../**/*.md" 