<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <!-- Favicon - MedCheck Analytics Identity -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-16-v2.svg" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon.ico?v=2024" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo-medcheck.png?v=2024" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="msapplication-TileColor" content="#7c3aed" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- SEO and Meta -->
    <title>MedCheck - Sistema Médico de Auditoria CBHPM</title>
    <meta name="description" content="Sistema inteligente de auditoria médica para recuperação de honorários. Analise CBHPM, conteste glosas e recupere valores automaticamente." />
    <meta name="keywords" content="medcheck, cbhpm, auditoria médica, honorários médicos, glosas, contestação, ANS, sistema médico" />
    <meta name="author" content="MedCheck" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="MedCheck - Sistema Médico de Auditoria CBHPM" />
    <meta property="og:description" content="Sistema inteligente de auditoria médica para recuperação de honorários" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-medcheck.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedCheck - Sistema Médico" />
    <meta name="twitter:description" content="Auditoria médica inteligente para recuperação de honorários" />
    <!-- Anti-FOUC / tema -->
    <script>
      (function () {
        try {
          var storageKey = 'medcheck-theme';
          var theme = localStorage.getItem(storageKey);
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    
    <!-- Favicon Cache Buster -->
    <script>
      (function() {
        try {
          // Força reload de favicon se detectar problema
          var currentFavicon = document.querySelector('link[rel="icon"]');
          if (!currentFavicon || currentFavicon.href.includes('vite.svg')) {
            console.log('🔄 Corrigindo favicon...');
            var timestamp = Date.now();
            var newFavicon = document.createElement('link');
            newFavicon.rel = 'icon';
            newFavicon.type = 'image/svg+xml';
            newFavicon.href = '/favicon-analytics.svg?v=' + timestamp;
            if (currentFavicon) currentFavicon.remove();
            document.head.appendChild(newFavicon);
          }
        } catch (e) {
          console.log('Favicon script error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
