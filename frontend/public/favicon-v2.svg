<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="analytics-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#analytics-gradient)"/>
  
  <!-- Analytics/Chart representation -->
  <g fill="#ffffff">
    <!-- Chart bars representing CBHPM analysis -->
    <rect x="6" y="18" width="3" height="8" rx="1"/>
    <rect x="11" y="14" width="3" height="12" rx="1"/>
    <rect x="16" y="10" width="3" height="16" rx="1"/>
    <rect x="21" y="16" width="3" height="10" rx="1"/>
  </g>
  
  <!-- Medical pulse overlay -->
  <path d="M5 8 L8 8 L10 5 L12 11 L14 6 L16 12 L18 7 L20 9 L27 9" 
        stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Check mark for verification -->
  <circle cx="25" cy="7" r="3" fill="#10b981"/>
  <path d="M23.5 7 L24.5 8 L26.5 6" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
