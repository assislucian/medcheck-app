<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="mc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Shape - Modern Rounded Square -->
  <rect x="2" y="2" width="28" height="28" rx="7" ry="7" fill="url(#mc-gradient)"/>
  
  <!-- Letter "M" for MedCheck - Stylized -->
  <g fill="#ffffff">
    <!-- Left vertical line of M -->
    <rect x="7" y="9" width="3" height="14" rx="1"/>
    <!-- Right vertical line of M -->
    <rect x="22" y="9" width="3" height="14" rx="1"/>
    <!-- Left diagonal of M -->
    <polygon points="10,9 13,9 16,16 13,16"/>
    <!-- Right diagonal of M -->  
    <polygon points="19,16 22,9 19,9 16,16"/>
    <!-- Center peak -->
    <rect x="15" y="9" width="2" height="8" rx="1"/>
  </g>
  
  <!-- Medical pulse/heartbeat line accent -->
  <path d="M6 24 L10 24 L12 20 L14 28 L16 16 L18 28 L20 20 L22 24 L26 24" 
        stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
