<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="doc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="3" y="3" width="26" height="26" rx="6" fill="url(#doc-gradient)"/>
  
  <!-- Document/Chart Icon -->
  <g fill="#ffffff">
    <!-- Document background -->
    <rect x="8" y="7" width="16" height="18" rx="2" fill="#ffffff" opacity="0.95"/>
    
    <!-- Document lines (representing CBHPM data) -->
    <rect x="10" y="10" width="8" height="1" fill="#0f766e" opacity="0.6"/>
    <rect x="10" y="12" width="12" height="1" fill="#0f766e" opacity="0.6"/>
    <rect x="10" y="14" width="6" height="1" fill="#0f766e" opacity="0.6"/>
    <rect x="10" y="16" width="10" height="1" fill="#0f766e" opacity="0.6"/>
    
    <!-- Check mark - Audit complete -->
    <circle cx="20" cy="19" r="4" fill="#059669"/>
    <path d="M18 19 L19.5 20.5 L22 18" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Medical cross accent in corner -->
  <g fill="#ffffff" opacity="0.8">
    <rect x="25" y="9" width="1.5" height="6"/>
    <rect x="22.75" y="11.25" width="6" height="1.5"/>
  </g>
</svg>
