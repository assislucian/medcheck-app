services:
  # BACKUP: Backend com Python 3.10 (mais estável)
  - type: web
    name: medcheck-backend
    env: python
    plan: starter
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
      
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
    
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /opt/render/project/src
    
    healthCheckPath: /health 