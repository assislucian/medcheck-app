services:
  # Frontend Static Site com configuração SPA
  # NOTA: medcheck-frontend-v2 é usado porque 'medcheck-frontend' já existe
  # com tipo diferente. Para usar o nome original, delete o serviço antigo no Dashboard
  - type: web
    name: medcheck-frontend-v2
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
    autoDeployTrigger: commit

  # Backend Web Service
  - type: web
    name: medcheck-backend
    runtime: python
    plan: free # Adicionando o plano gratuito
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
    autoDeployTrigger: commit
