services:
  # Backend API - FastAPI otimizado
  - type: web
    name: medcheck-backend
    env: python
    plan: starter
    buildCommand: |
      # Usar Python 3.11 para compatibilidade
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      
      # Verificar instalação
      python -c "import pandas; print(f'Pandas {pandas.__version__} instalado com sucesso')"
      python -c "import fastapi; print(f'FastAPI {fastapi.__version__} instalado com sucesso')"
      
    startCommand: |
      # Configurar PYTHONPATH
      export PYTHONPATH="${PYTHONPATH}:/opt/render/project/src"
      
      # Iniciar servidor otimizado
      uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
      
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONPATH
        value: /opt/render/project/src
    
    # Health check
    healthCheckPath: /health
    
    # Garantir que ignora frontend
    buildFilter:
      paths:
      - "**"
      ignoredPaths:
      - "frontend/**"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "package.json"
      - "node_modules/**"
