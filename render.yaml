services:
  # Backend API
  - type: web
    name: medcheck-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: RATE_LIMIT
        value: "10 per minute"
      - key: LOG_LEVEL
        value: INFO
      # Estas devem ser configuradas manualmente no painel do Render:
      # - JWT_SECRET (gerar uma chave de 32+ caracteres)
      # - CORS_ALLOWED_ORIGINS (URLs do frontend separadas por vírgula)
      # - DATABASE_URL (será fornecido automaticamente pelo PostgreSQL service)

  # PostgreSQL Database
  - type: pgsql
    name: medcheck-db
    plan: starter
    databaseName: medcheck
    user: medcheck_user
