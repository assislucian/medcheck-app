services:
  # Frontend Static Site - Configuração Definitiva
  - type: static
    name: medcheck-frontend
    # Isola o build APENAS para o diretório frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    # SPA routing continua igual
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend API Service - Configuração Definitiva
  - type: web
    name: medcheck-backend
    runtime: python
    # Fixa a versão do Python para 3.11 (LTS e estável no Render)
    pythonVersion: "3.11"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://medcheck-frontend.onrender.com

databases:
  - name: medcheck-db
    plan: free
