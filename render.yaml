services:
  - type: web
    name: medcheck-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: ADMIN_SECRET
        value: bQ7nP4yZrS1wV8kC5mT2xA9dL3fH6gJ0
      - key: JWT_SECRET
        value: bQ7nP4yZrS1wV8kC5mT2xA9dL3fH6gJ0
      - key: FRONTEND_ORIGINS
        value: "https://medcheck-app.vercel.app,https://medcheck-app-assislucians-projects.vercel.app"
      - key: FRONTEND_ORIGIN_REGEX
        value: "https://medcheck-[a-z0-9-]+-assislucians-projects\\.vercel\\.app"
    disk:
      name: medcheck-disk
      mountPath: /app/data
      sizeGB: 1

  - type: pserv
    name: medcheck-postgres
    env: postgresql
    plan: starter
