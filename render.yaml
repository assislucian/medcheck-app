databases:
  - name: medcheck-database
    databaseName: medcheck_production
    user: medcheck_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"

services:
  - type: web
    name: medcheck-backend
    runtime: python
    branch: main
    plan: free
    region: frankfurt
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-database
          property: connectionString

  - type: web
    name: medcheck-frontend
    runtime: node
    branch: main
    rootDir: frontend
    plan: free
    region: frankfurt
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com
