databases:
  # === DATABASE SERVICE ===
  - name: medcheck-database
    plan: free
    databaseName: medcheck_prod
    user: medcheck_user
    region: oregon

services:
  # === BACKEND SERVICE ===
  - type: web
    name: medcheck-backend
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /health
    region: oregon
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: "python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-database
          property: connectionString

  # === FRONTEND SERVICE ===
  - type: web
    name: medcheck-frontend
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com
