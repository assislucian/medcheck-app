services:
  # Backend API - FastAPI otimizado
  - type: web
    name: medcheck-backend
    env: python
    plan: starter
    runtime: python-3.11.9
    buildCommand: |
      # Forçar Python 3.11
      echo "Python version:"
      python --version
      python3.11 --version || echo "Python 3.11 not found, using default"
      
      # Upgrade pip
      python -m pip install --upgrade pip
      
      # Instalar com cache para acelerar
      pip install --no-cache-dir -r requirements.txt
      
      # Verificar instalação
      python -c "import fastapi; print('FastAPI OK')"
      python -c "import pandas; print('Pandas OK')" || echo "Pandas failed"
      
    startCommand: |
      # Configurar PYTHONPATH
      export PYTHONPATH="/opt/render/project/src:$PYTHONPATH"
      
      # Iniciar servidor
      uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
      
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /opt/render/project/src
    
    # Health check
    healthCheckPath: /health
    
    # Garantir que ignora frontend
    buildFilter:
      paths:
      - "**"
      ignoredPaths:
      - "frontend/**"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "package.json"
      - "node_modules/**"
