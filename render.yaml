services:
  # Backend API - FastAPI (Python 3.13.4 com wheels)
  - type: web
    name: medcheck-backend
    env: python
    plan: starter
    buildCommand: |
      # Mostrar versão Python
      python --version
      
      # Upgrade pip e instalar build essentials primeiro
      pip install --upgrade pip setuptools wheel
      
      # Instalar requirements (que já inclui setuptools/wheel)
      pip install -r requirements.txt
      
      # Verificar instalação crítica
      python -c "import fastapi, pandas, numpy; print('✅ Dependências OK')"
      
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
    
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: /opt/render/project/src
    
    healthCheckPath: /health
    
    # Garantir que ignora frontend
    buildFilter:
      paths:
      - "**"
      ignoredPaths:
      - "frontend/**"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "package.json"
      - "node_modules/**"
