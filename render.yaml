services:
  # === BACKEND SERVICE ===
  - type: web
    name: medcheck-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: |
      echo "🚀 Starting MedCheck Backend Build..."
      echo "Python version:" $(python --version)
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      echo "✅ Dependencies installed successfully"
      python -c "import fastapi, pydantic, sqlalchemy, psycopg2; print('✅ All critical imports working')"
      echo "✅ Backend build completed"
    startCommand: |
      echo "🚀 Starting MedCheck API Production..."
      python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT
    envVars:
      # === APLICAÇÃO ===
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false

      # === SEGURANÇA ===
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

      # === DATABASE (PostgreSQL automático do Render) ===
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-database
          property: connectionString

      # === CORS (Frontend URLs) ===
      - key: FRONTEND_ORIGIN
        value: https://medcheck-frontend.onrender.com

      # === LOG LEVEL ===
      - key: LOG_LEVEL
        value: INFO

  # === DATABASE SERVICE ===
  - type: pgsql
    name: medcheck-database
    plan: free
    databaseName: medcheck_prod
    user: medcheck_user

  # === FRONTEND SERVICE ===
  - type: web
    name: medcheck-frontend
    runtime: node
    plan: free
    branch: main
    buildCommand: |
      echo "🚀 Starting Frontend Build..."
      cd frontend
      echo "Node version:" $(node --version)
      echo "NPM version:" $(npm --version)
      npm ci
      echo "✅ Dependencies installed"
      npm run build
      echo "✅ Frontend build completed"
    startCommand: |
      echo "🚀 Starting Frontend Production Server..."
      cd frontend
      npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      # === API CONFIGURATION ===
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com

      # === ENVIRONMENT ===
      - key: NODE_ENV
        value: production

      # === BUILD OPTIMIZATION ===
      - key: GENERATE_SOURCEMAP
        value: false

# === CONFIGURAÇÕES GLOBAIS ===
previewsEnabled: false
region: oregon
