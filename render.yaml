services:
  # Backend API - MedCheck Production COMPLETO INTEGRADO
  - type: web
    name: medcheck-backend
    env: python
    plan: starter
    buildCommand: |
      # Verificar Python padrão
      python --version

      # Upgrade pip e tools
      pip install --upgrade pip setuptools wheel

      # Instalar dependencies
      pip install -r requirements.txt

      # Verificar instalação
      python -c "import fastapi, httpx, sqlalchemy, psycopg2, passlib, jose; print('✅ All dependencies OK')"

    startCommand: uvicorn src.api_production:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      # === APPLICATION CONFIG ===
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: MedCheck API
      - key: APP_VERSION
        value: "1.0.0"
      - key: PYTHONPATH
        value: /opt/render/project/src

      # === CORS CONFIG ===
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOWED_METHODS
        value: "*"
      - key: CORS_ALLOWED_HEADERS
        value: "*"

      # === DATABASE CONFIG - PostgreSQL Render ===
      - key: DATABASE_URL
        value: postgresql://medcheck_user:R1ezAOHtY6sI05JHpVqnNEqNa3LPPulm@dpg-d20eluvgi27c73chfk60-a/medcheck_production
      - key: DB_HOST
        value: dpg-d20eluvgi27c73chfk60-a
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: medcheck_production
      - key: DB_USER
        value: medcheck_user
      - key: DB_PASSWORD
        value: R1ezAOHtY6sI05JHpVqnNEqNa3LPPulm
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"

      # === SECURITY CONFIG ===
      - key: SECRET_KEY
        value: "medcheck-secret-key-2025-production-render"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: "HS256"

      # === FILE UPLOAD CONFIG ===
      - key: MAX_UPLOAD_SIZE
        value: "10485760" # 10MB
      - key: UPLOAD_FOLDER
        value: "/tmp/uploads"
      - key: ALLOWED_EXTENSIONS
        value: "pdf,xlsx,xls,csv"

      # === API CONFIG ===
      - key: API_V1_STR
        value: "/api/v1"
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:3000,https://medcheck-frontend.onrender.com"

    healthCheckPath: /health
