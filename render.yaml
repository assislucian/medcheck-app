services:
  # Frontend Static Site
  - type: web
    name: medcheck-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com

  # Backend API Service
  - type: web
    name: medcheck-backend
    runtime: python
    pythonVersion: "3.12"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownTime: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://medcheck-frontend.onrender.com
      - key: PYTHONPATH
        value: .

databases:
  - name: medcheck-db
    plan: free
    databaseName: medcheck
    user: medcheck
