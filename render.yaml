services:
  # Frontend Static Site
  - type: web
    name: medcheck-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com

  # Backend API Service
  - type: web
    name: medcheck-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 2 --loop uvloop --http httptools --log-level warning --access-log --no-use-colors
    # Forçar atualização de cache
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /opt/render/project
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      # Performance optimizations
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: WORKERS
        value: "2"
      # Memory optimization
      - key: WEB_CONCURRENCY
        value: "2"
      - key: MAX_WORKERS
        value: "2"
      # Database connection pooling
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"
      # Security
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-db
          property: connectionString
      # CORS
      - key: FRONTEND_ORIGINS
        value: https://medcheck-frontend.onrender.com,https://medcheck-app.vercel.app,https://medcheck-app-assislucians-projects.vercel.app

databases:
  - name: medcheck-db
    plan: free
