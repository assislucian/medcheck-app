services:
  # === BACKEND SERVICE ===
  - type: web
    name: medcheck-backend
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /health
    buildCommand: |
      echo "🚀 Starting MedCheck Backend Build..."
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      echo "✅ Dependencies installed successfully"
    startCommand: |
      echo "🚀 Starting MedCheck API Production..."
      python -m uvicorn src.api_render_production:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medcheck-database
          property: connectionString

  # === DATABASE SERVICE ===
  - type: pgsql
    name: medcheck-database
    plan: free
    databaseName: medcheck_prod
    user: medcheck_user

  # === FRONTEND SERVICE ===
  - type: web
    name: medcheck-frontend
    runtime: node
    plan: free
    branch: main
    healthCheckPath: /
    buildCommand: |
      echo "🚀 Starting Frontend Build..."
      cd frontend
      npm install
      npm run build
      echo "✅ Frontend build completed"
    startCommand: |
      echo "🚀 Starting Frontend Production Server..."
      cd frontend
      npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://medcheck-backend.onrender.com

# === CONFIGURAÇÕES GLOBAIS ===
previewsEnabled: false
region: oregon
