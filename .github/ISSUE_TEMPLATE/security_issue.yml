name: 🔒 Security Issue
description: Reportar problema de segurança (NON-CRITICAL ONLY)
title: "[Security] "
labels: ["security", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **IMPORTANTE**: Este template é apenas para vulnerabilidades de **BAIXO/MÉDIO RISCO**

        🚨 **Para vulnerabilidades CRÍTICAS (CVSS ≥ 7.0):**
        - **NÃO** abra issue pública
        - Email: security@medcheck.com.br
        - Veja: [SECURITY.md](../SECURITY.md)

  - type: dropdown
    id: severity
    attributes:
      label: 📊 Severidade
      description: Classifique o risco
      options:
        - Baixa (CVSS 0.1-3.9) - Informacional
        - Média (CVSS 4.0-6.9) - Requer atenção
        - 🚨 PARE! Esta é crítica - use security@medcheck.com.br
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 🔍 Descrição da Vulnerabilidade
      description: Descreva o problema de segurança
      placeholder: |
        Exemplo: O endpoint /api/users não valida adequadamente permissões...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Categoria
      description: Tipo de vulnerabilidade
      options:
        - Authentication/Authorization
        - Input Validation
        - Session Management
        - Cross-Site Scripting (XSS)
        - Cross-Site Request Forgery (CSRF)
        - Information Disclosure
        - Configuration Issue
        - Dependency Vulnerability
        - LGPD/Privacy
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 🧩 Componente Afetado
      description: Onde está a vulnerabilidade?
      options:
        - Frontend (React)
        - Backend API (FastAPI)
        - Authentication System
        - File Upload/Parser
        - Database Access
        - External Integrations
        - Infrastructure/Deploy
        - Dependencies
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 🎯 Impacto Potencial
      description: O que um atacante poderia fazer?
      placeholder: |
        - Acessar dados de outros usuários
        - Modificar configurações
        - Executar código no servidor
        - Vazar informações sensíveis
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Passos para Reproduzir
      description: Como reproduzir a vulnerabilidade
      placeholder: |
        1. Acesse endpoint X
        2. Envie payload Y
        3. Observe que Z acontece...
    validations:
      required: true

  - type: textarea
    id: poc
    attributes:
      label: 🧪 Proof of Concept
      description: Código ou comandos que demonstram o problema
      render: text
      placeholder: |
        curl -X POST https://example.com/api/endpoint \
          -H "Content-Type: application/json" \
          -d '{"malicious": "payload"}'

  - type: textarea
    id: mitigation
    attributes:
      label: 🛡️ Mitigação Sugerida
      description: Como você corrigiria isso?
      placeholder: |
        - Adicionar validação de input
        - Implementar rate limiting
        - Corrigir verificação de permissões
        - Atualizar dependência X para versão Y

  - type: dropdown
    id: environment
    attributes:
      label: 🌍 Ambiente
      description: Onde foi identificado?
      options:
        - Produção
        - Staging
        - Local (desenvolvimento)
        - Code review
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 📚 Referências
      description: CVEs, artigos, ferramentas usadas
      placeholder: |
        - CVE-2023-XXXXX
        - OWASP Top 10: A01:2021
        - Tool: Burp Suite, OWASP ZAP
        - https://example.com/security-advisory

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: 🔒 Confirmei que esta NÃO é uma vulnerabilidade crítica
          required: true
        - label: 📖 Li as diretrizes em SECURITY.md
          required: true
        - label: 🔍 Verifiquei que não há issues similares
          required: true
        - label: 🤝 Estou seguindo responsible disclosure
          required: true
