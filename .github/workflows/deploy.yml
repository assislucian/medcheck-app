name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest
    name: Pre-deploy Security Check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      - name: Frontend security audit
        working-directory: ./frontend
        run: npm audit --audit-level high

      - name: Backend security audit
        run: safety check

    outputs:
      security-passed: ${{ steps.security-check.outcome == 'success' }}

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    needs: security-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test-backend:
    runs-on: ubuntu-latest
    name: Test Backend
    needs: security-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: |
          python -m pytest tests/ -v --cov=src

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  deploy-to-vercel:
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    needs: [build-frontend, test-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod"

      - name: Comment deployment status
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const { context } = require('@actions/github');
            const deploymentUrl = process.env.VERCEL_URL || 'https://medcheck-app.vercel.app';

            const comment = `🚀 **Deploy Successful!**

            ✅ Security checks passed
            ✅ Build completed successfully  
            ✅ Tests passed
            ✅ Deployed to production

            🔗 **Live URL:** ${deploymentUrl}

            📊 **Deploy Details:**
            - Commit: ${context.sha.substring(0, 7)}
            - Branch: ${context.ref.replace('refs/heads/', '')}
            - Timestamp: ${new Date().toISOString()}`;

            console.log(comment);

  notification:
    runs-on: ubuntu-latest
    name: Deployment Notification
    needs: [deploy-to-vercel]
    if: always()

    steps:
      - name: Notify deployment result
        run: |
          if [[ "${{ needs.deploy-to-vercel.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            echo "Site is live at: https://medcheck-app.vercel.app"
          else
            echo "❌ Deployment failed!"
            echo "Check the logs for details"
