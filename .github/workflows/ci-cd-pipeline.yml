name: MedCheck CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 18
  PYTHON_VERSION: 3.11

jobs:
  # Fase 1: Análise de código e linting
  code-quality:
    name: 📝 Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 mypy bandit safety

      - name: Frontend Linting
        working-directory: ./frontend
        run: |
          npm run lint
          npm run type-check

      - name: Backend Linting
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/
          flake8 src/ tests/
          mypy src/

      - name: Security Scan - Backend
        run: |
          bandit -r src/ -f json -o bandit-report.json
          safety check --json --output safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # Fase 2: Testes unitários
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Backend Unit Tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=html --cov-report=xml --cov-report=term
        env:
          TESTING: true

      - name: Frontend Unit Tests
        working-directory: ./frontend
        run: |
          npm run test:unit -- --coverage --reporter=junit --outputFile=test-results.xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Coverage Gate
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          coverage = float(tree.getroot().attrib['line-rate']) * 100
          print(f'Coverage: {coverage:.1f}%')
          assert coverage >= 80.0, f'Coverage {coverage:.1f}% is below 80% threshold'
          "

  # Fase 3: Testes de integração
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medcheck_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Integration Tests
        run: pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medcheck_test
          TESTING: true

  # Fase 4: Build e testes E2E
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medcheck_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start backend server
        run: |
          python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medcheck_test

      - name: Start frontend server
        working-directory: ./frontend
        run: |
          npm run preview -- --port 3000 --host 0.0.0.0 &
          sleep 5

      - name: Run E2E Tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

  # Fase 5: Testes de performance
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Performance Tests
        run: |
          k6 run tests/performance/load-test.js
        env:
          BASE_URL: http://localhost:8000

      - name: Lighthouse CI
        working-directory: ./frontend
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Fase 6: Testes de segurança
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    needs: performance-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"

      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: zap-scan-results
          path: report_html.html

  # Fase 7: Testes de acessibilidade
  accessibility-tests:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    needs: security-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Accessibility Tests
        working-directory: ./frontend
        run: npx playwright test --grep "accessibility"

      - name: Upload A11y Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: accessibility-results
          path: frontend/accessibility-report/

  # Fase 8: Build final e deploy para staging
  build-and-deploy-staging:
    name: 🚀 Build & Deploy Staging
    runs-on: ubuntu-latest
    needs: [accessibility-tests]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://medcheck-staging.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--env VITE_API_URL=${{ secrets.STAGING_API_URL }}"

      - name: Run Smoke Tests on Staging
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1
          curl -f https://medcheck-staging.vercel.app || exit 1

  # Fase 9: Deploy para produção (apenas main branch)
  deploy-production:
    name: 🌟 Deploy Production
    runs-on: ubuntu-latest
    needs: [build-and-deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://medcheck.vercel.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod --env VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}"

      - name: Final Smoke Tests
        run: |
          curl -f ${{ secrets.PRODUCTION_API_URL }}/health || exit 1
          curl -f https://medcheck.vercel.app || exit 1

      - name: Notify Success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          text: "✅ MedCheck deploy realizado com sucesso!"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Relatórios finais
  generate-reports:
    name: 📊 Generate Reports
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Test Coverage Report
        run: |
          echo "# 📋 MedCheck - Relatório de Testes" > TEST-COVERAGE.md
          echo "" >> TEST-COVERAGE.md
          echo "## ✅ Status dos Testes" >> TEST-COVERAGE.md
          echo "- Testes Unitários: ${{ needs.unit-tests.result }}" >> TEST-COVERAGE.md
          echo "- Testes Integração: ${{ needs.integration-tests.result }}" >> TEST-COVERAGE.md
          echo "- Testes E2E: ${{ needs.e2e-tests.result }}" >> TEST-COVERAGE.md
          echo "- Testes Performance: ${{ needs.performance-tests.result }}" >> TEST-COVERAGE.md
          echo "- Testes Segurança: ${{ needs.security-tests.result }}" >> TEST-COVERAGE.md
          echo "- Testes Acessibilidade: ${{ needs.accessibility-tests.result }}" >> TEST-COVERAGE.md
          echo "" >> TEST-COVERAGE.md
          echo "## 📈 Métricas de Qualidade" >> TEST-COVERAGE.md
          echo "- Cobertura de Código: ≥80%" >> TEST-COVERAGE.md
          echo "- Lighthouse Score: ≥90" >> TEST-COVERAGE.md
          echo "- Zero vulnerabilidades High" >> TEST-COVERAGE.md
          echo "- 100% conformidade WCAG" >> TEST-COVERAGE.md

      - name: Upload Final Report
        uses: actions/upload-artifact@v3
        with:
          name: final-test-report
          path: TEST-COVERAGE.md

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('TEST-COVERAGE.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
